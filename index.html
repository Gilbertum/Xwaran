<!-- Галерея Артов -->
    <section id="gallery" class="content-section">
        <h2 style="text-align: center; font-size: 2em; margin-bottom: 10px;">ГАЛЕРЕЯ</h2>
        
        <!-- Раздел 1: Арты от Хвори -->
        <h3 class="gallery-subtitle">Арты от Хвори</h3>
        <div class="art-grid">
            <img src="images/stone.png" alt="Art Stone">
            <img src="images/night.png" alt="Art Night">
        </div>

        <!-- Раздел 2: Арты от чатика -->
        <h3 class="gallery-subtitle">Арты от чатика</h3>
        <div class="art-grid">
            <!-- Сюда добавляй картинки из новой папки images_fan -->
            <img src="images_fan/fanart1.png" alt="Фапарт 1" onerror="this.style.display='none'"> 
            <img src="images_fan/fanart2.png" alt="Фапарт 2" onerror="this.style.display='none'">
        </div>

        <!-- Раздел 3: Арты художников -->
        <h3 class="gallery-subtitle">Арты художников</h3>
        <div class="art-grid">
            <div class="art-card">
                <img src="images_art/art.png" alt="Art by Artist">
                <a href="https://vk.com/artist_link" target="_blank" class="artist-link">🎨 Автор: @ArtistName</a>
            </div>
            <div class="art-card">
                <img src="images_art/bath.png" alt="Art Bath">
                <a href="https://t.me/artist_link" target="_blank" class="artist-link">🎨 Автор: @ArtistName</a>
            </div>
        </div>
    </section>

    <!-- Модальное окно для увеличения картинок -->
    <div id="image-modal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="expanded-img">
    </div>

    <script src="main.js"></script>
</body>
</html>
